x-runtime: &runtime
  build: .
  env_file: .env
  profiles: ["pilot"]
  environment:
    DATABASE_URL: postgres://city:${POSTGRES_PASSWORD:-city_local}@db:5432/city
    HOST: 0.0.0.0
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: city
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-city_local}
      POSTGRES_DB: city
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["city_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U city"]
      interval: 5s
      retries: 10
  migrate:
    <<: *runtime
    command: ["node", "build/server/setup.mjs"]
  app:
    <<: *runtime
    ports: ["127.0.0.1:3001:3001"]
    volumes: ["city_uploads:/app/uploads"]
    restart: unless-stopped
  bot:
    <<: *runtime
    command: ["node", "build/server/bot.mjs"]
    restart: unless-stopped
volumes:
  city_data:
  city_uploads:
